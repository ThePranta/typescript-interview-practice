<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>TypeScript Interview Practice</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--accent2:#eff6ff;--danger:#b91c1c;--code:#111827}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.container{max-width:1000px;margin:auto;padding:18px}.top{position:sticky;top:0;z-index:10;background:rgba(243,244,246,.96);backdrop-filter:blur(8px);padding-bottom:12px}
.header{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 4px 16px rgba(0,0,0,.05)}
h1{font-size:24px;margin:0 0 6px}.sub{color:var(--muted);font-size:14px}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
select,button,textarea{font:inherit}select,button{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--text)}button{cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button:disabled{opacity:.5;cursor:not-allowed}
.progress{height:9px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:12px}.progress>div{height:100%;background:var(--accent);width:0}
.card{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 4px 16px rgba(0,0,0,.04)}
.kicker{color:var(--accent);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}.question{font-size:21px;font-weight:700;margin:7px 0 18px}
label{font-size:14px;font-weight:700;display:block;margin-bottom:8px}.save{font-size:12px;color:var(--muted);float:right;font-weight:500}textarea{width:100%;min-height:300px;resize:vertical;border:1px solid #d1d5db;border-radius:12px;padding:14px;line-height:1.5;outline:none;background:#fff}textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.controls{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:14px}.leftBtns,.rightBtns{display:flex;gap:10px;flex-wrap:wrap}
details{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fafafa}summary{cursor:pointer;font-weight:700}.hint{margin-top:10px;color:#374151;line-height:1.55}.answer{margin-top:10px;background:var(--code);color:#f9fafb;border-radius:10px;padding:14px;overflow:auto;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;font-size:13px;line-height:1.55}
.bottom{margin-top:14px;color:var(--muted);font-size:12px;text-align:center;padding-bottom:24px}.danger{color:var(--danger)}
@media(max-width:600px){.container{padding:10px}.header,.card{padding:15px;border-radius:14px}h1{font-size:20px}.question{font-size:18px}textarea{min-height:240px}.controls{flex-direction:column}.leftBtns,.rightBtns{width:100%}.leftBtns button,.rightBtns button{flex:1}}
</style></head>
<body>
<div class="container">
<div class="top"><div class="header">
<h1>TypeScript Interview Practice</h1>
<div class="sub">30 problems • Write your answer first • Hint and suggested answer stay hidden until you open them</div>
<div class="bar"><select id="problemSelect"></select><button id="copyBtn">Copy Question</button><span id="saveState" class="sub"></span></div>
<div class="progress"><div id="progressFill"></div></div>
</div></div>
<div class="card">
<div class="kicker" id="problemNo"></div>
<div class="question" id="question"></div>
<label for="answer">✍️ Your Answer <span class="save" id="answerState">Not started</span></label>
<textarea id="answer" placeholder="Write your TypeScript solution here..."></textarea>
<div style="display:flex;justify-content:flex-end;margin-top:8px"><button id="copyYourAnswerBtn">Copy Your Answer</button></div>
<div class="controls"><div class="leftBtns"><button id="prevBtn">← Previous</button><button id="nextBtn" class="primary">Next →</button></div><div class="rightBtns"><button id="clearBtn" class="danger">Reset Answer</button></div></div>
<details><summary>💡 Show Hint</summary><div class="hint" id="hint"></div></details>
<details><summary>✅ Show Suggested Answer</summary><div style="display:flex;justify-content:flex-end;margin:10px 0 8px"><button id="copySolutionBtn">Copy Suggested Answer</button></div><div class="answer" id="solution"></div></details>
</div>
<div class="bottom">Answers are saved automatically in this browser using local storage. Clearing browser data will remove saved answers.</div>
</div>
<script>
const problems = [{"id": 1, "title": "Reverse a String", "hint": "Start from the last character and build a new string moving toward index 0.", "solution": "function reverseString(str: string): string {\nlet result = \"\";\nfor (let i = str.length - 1; i >= 0; i--)\n{\nresult += str[i];\n}\nreturn result;\n}"}, {"id": 2, "title": "Check whether a String is a Palindrome", "hint": "Use two pointers: one at the beginning and one at the end. Compare and move inward.", "solution": "function isPalindrome(str: string): boolean {\nlet left = 0;\nlet right = str.length - 1;\nwhile (left < right) {\nif (str[left] !== str[right]) {\nreturn false;\n}\nleft++;\nright--;\n}\nreturn true;\n}"}, {"id": 3, "title": "Check whether two Strings are Anagrams", "hint": "First check lengths. Count characters from the first string, subtract using the second, then verify all counts return to zero.", "solution": "function isAnagram(str1: string, str2: string): boolean {\nif (str1.length !== str2.length) return\nfalse;\nconst freq: number[] = new\nArray(256).fill(0);\nfor (let i = 0; i < str1.length; i++) {\nfreq[str1.charCodeAt(i)]++;\n}\nfor (let i = 0; i < str2.length; i++) {\nfreq[str2.charCodeAt(i)]--;\n}\nfor (let i = 0; i < 256; i++) {\nif (freq[i] !== 0) return false;\n}\nreturn true;\n}"}, {"id": 4, "title": "Count Occurrences of Each Character in a String", "hint": "Keep two arrays: one for unique characters and one for their counts. Search the first array with a loop.", "solution": "interface CharCount {\nchar: string;\ncount: number;\n}\nfunction countCharOccurrences(str: string): CharCount[] {\nconst chars: string[] = [];\nconst counts: number[] = [];\nfor (let i = 0; i < str.length; i++) {\nconst c = str[i];\nlet found = -1;\nfor (let j = 0; j < chars.length; j++) {\nif (chars[j] === c) {\nfound = j;\nbreak;\n}\n}\nif (found === -1) {\nchars.push(c);\ncounts.push(1);\n} else {\ncounts[found]++;\n}\n}\nconst result: CharCount[] = [];\nfor (let i = 0; i < chars.length; i++) {\nresult.push({ char: chars[i], count:\ncounts[i] });\n}\nreturn result;\n}"}, {"id": 5, "title": "Remove All Vowels From a String", "hint": "Read each character and add it to the result only when it is not a vowel.", "solution": "function removeVowels(str: string): string {\nlet result = \"\";\nfor (let i = 0; i < str.length; i++) {\nconst c = str[i];\nconst lower = c >= \"A\" && c <= \"Z\" ? String.fromCharCode(c.charCodeAt(0) + 32) : c;\nif (\nlower !== \"a\" && lower !== \"e\" && lower !== \"i\" && lower !== \"o\" && lower !== \"u\"\n) {\nresult += c;\n}\n}\nreturn result;\n}"}, {"id": 6, "title": "First Non-Repeated and First Repeated Character in a String", "hint": "First count every character. Then scan the character list in original order for count 1 and count greater than 1.", "solution": "interface FirstCharResult {\nfirstNonRepeated: string | null;\nfirstRepeated: string | null;\n}\nfunction firstNonRepeatedAndRepeatedChar(str: string): FirstCharResult {\nconst chars: string[] = [];\nconst counts: number[] = [];\nfor (let i = 0; i < str.length; i++) {\nconst c = str[i];\nlet found = -1;\nfor (let j = 0; j < chars.length; j++) {\nif (chars[j] === c) {\nfound = j;\nbreak;\n}\n}\nif (found === -1) {\nchars.push(c);\ncounts.push(1);\n} else {\ncounts[found]++;\n}\n}\nlet firstNonRepeated: string | null = null;\nlet firstRepeated: string | null = null;\nfor (let i = 0; i < chars.length; i++) {\nif (counts[i] === 1 && firstNonRepeated === null) {\nfirstNonRepeated = chars[i];\n}\nif (counts[i] > 1 && firstRepeated === null) {\nfirstRepeated = chars[i];\n}\n}\nreturn { firstNonRepeated, firstRepeated };\n}"}, {"id": 7, "title": "Reverse a Sentence Word by Word", "hint": "Build the words manually, then add them to the result starting from the last word.", "solution": "function reverseSentenceWordByWord(sentence: string): string {\nconst words: string[] = [];\nlet current = \"\";\nfor (let i = 0; i < sentence.length; i++)\n{\nif (sentence[i] === \" \") {\nwords.push(current);\ncurrent = \"\";\n} else {\ncurrent += sentence[i];\n}\n}\nwords.push(current);\nlet result = \"\";\nfor (let i = words.length - 1; i >= 0;\ni--) {\nresult += words[i];\nif (i !== 0) result += \" \";\n}\nreturn result;\n}"}, {"id": 8, "title": "Reverse Each Word of a Sentence (word order stays the same)", "hint": "Process one word at a time. Reverse only the characters inside each word; keep the word order.", "solution": "function reverseEachWord(sentence: string): string {\nlet result = \"\";\nlet word = \"\";\nfor (let i = 0; i <= sentence.length; i++)\n{\nconst c = sentence[i];\nif (c === \" \" || i === sentence.length) {\nlet reversedWord = \"\";\nfor (let j = word.length - 1; j >= 0;\nj--) {\nreversedWord += word[j];\n}\nresult += reversedWord;\nif (i !== sentence.length) result += \" \";\nword = \"\";\n} else {\nword += c;\n}\n}\nreturn result;\n}"}, {"id": 9, "title": "Find Duplicate Elements in an Array", "hint": "For each value, check whether it appeared earlier. Then count its total occurrences and keep it when the count is greater than 1.", "solution": "function findDuplicates(arr: number[]): number[] {\nconst duplicates: number[] = [];\nfor (let i = 0; i < arr.length; i++) {\nlet seenBefore = false;\nfor (let k = 0; k < i; k++) {\nif (arr[k] === arr[i]) {\nseenBefore = true;\nbreak;\n}\n}\nif (seenBefore) continue;\nlet count = 0;\nfor (let j = 0; j < arr.length; j++) {\nif (arr[j] === arr[i]) count++;\n}\nif (count > 1) duplicates.push(arr[i]);\n}\nreturn duplicates;\n}"}, {"id": 10, "title": "Find All Pairs in Array Whose Sum Equals a Given Number", "hint": "Use two nested loops. Compare every pair only once by starting the inner loop at i + 1.", "solution": "function findPairsWithSum(arr: number[], targetSum: number): number[][] {\nconst pairs: number[][] = [];\nfor (let i = 0; i < arr.length; i++) {\nfor (let j = i + 1; j < arr.length; j++)\n{\nif (arr[i] + arr[j] === targetSum) {\npairs.push([arr[i], arr[j]]);\n}\n}\n}\nreturn pairs;\n}"}, {"id": 11, "title": "Find Triplets in Array Whose Sum Equals a Given Number", "hint": "Use three nested loops. Pick three different indices and check whether their sum equals the target.", "solution": "function findTripletsWithSum(arr: number[], targetSum: number): number[][] {\nconst triplets: number[][] = [];\nfor (let i = 0; i < arr.length; i++) {\nfor (let j = i + 1; j < arr.length; j++)\n{\nfor (let k = j + 1; k < arr.length;\nk++) {\nif (arr[i] + arr[j] + arr[k] === targetSum) {\ntriplets.push([arr[i], arr[j],\narr[k]]);\n}\n}\n}\n}\nreturn triplets;\n}"}, {"id": 12, "title": "Sort an Array Containing Only 0s and 1s (single pass, in place)", "hint": "Use two pointers from both ends. Move past correct 0s on the left and correct 1s on the right, then swap misplaced values.", "solution": "function sortZerosAndOnes(arr: number[]): number[] {\nlet left = 0;\nlet right = arr.length - 1;\nwhile (left < right) {\nwhile (arr[left] === 0 && left < right) left++;\nwhile (arr[right] === 1 && left\n< right) right--;\nif (left < right) {\nconst temp = arr[left];\narr[left] = arr[right];\narr[right] = temp;\nleft++;\nright--;\n}\n}\nreturn arr;\n}"}, {"id": 13, "title": "Sort an Array Containing Only 0s, 1s and 2s (Dutch National Flag)", "hint": "Use three regions: 0s before low, 1s between low and mid, and 2s after high.", "solution": "function sortZerosOnesTwos(arr: number[]): number[] {\nlet low = 0;\nlet mid = 0;\nlet high = arr.length - 1;\nwhile (mid <= high) {\nif (arr[mid] === 0) {\nconst temp = arr[low];\narr[low] = arr[mid];\narr[mid] = temp;\nlow++;\nmid++;\n} else if (arr[mid] === 1) {\nmid++;\n} else {\nconst temp = arr[mid];\narr[mid] = arr[high];\narr[high] = temp;\nhigh--;\n}\n}\nreturn arr;\n}"}, {"id": 14, "title": "Find Smallest and Second Smallest Element in an Array", "hint": "Track the smallest and second smallest while scanning once. Update both when a new minimum is found.", "solution": "interface MinPairResult {\nsmallest: number;\nsecondSmallest: number;\n}\nfunction findSmallestAndSecondSmallest(arr: number[]): MinPairResult {\nlet smallest = Infinity;\nlet secondSmallest = Infinity;\nfor (let i = 0; i < arr.length; i++) {\nconst value = arr[i];\nif (value < smallest) {\nsecondSmallest = smallest;\nsmallest = value;\n} else if (value < secondSmallest && value !== smallest) {\nsecondSmallest = value;\n}\n}\nreturn { smallest, secondSmallest };\n}"}, {"id": 15, "title": "Find Largest and Second Largest Element in an Array", "hint": "Track the largest and second largest while scanning once. Update both when a new maximum is found.", "solution": "interface MaxPairResult {\nlargest: number;\nsecondLargest: number;\n}\nfunction findLargestAndSecondLargest(arr: number[]): MaxPairResult {\nlet largest = -Infinity;\nlet secondLargest = -Infinity;\nfor (let i = 0; i < arr.length; i++) {\nconst value = arr[i];\nif (value > largest) {\nsecondLargest = largest;\nlargest = value;\n} else if (value > secondLargest && value !== largest) {\nsecondLargest = value;\n}\n}\nreturn { largest, secondLargest };\n}"}, {"id": 16, "title": "Remove Duplicates From an Array", "hint": "Build a result array and manually check whether the current value is already present before adding it.", "solution": "function removeDuplicates(arr: number[]): number[] {\nconst result: number[] = [];\nfor (let i = 0; i < arr.length; i++) {\nlet alreadyAdded = false;\nfor (let j = 0; j < result.length; j++)\n{\nif (result[j] === arr[i]) {\nalreadyAdded = true;\nbreak;\n}\n}\nif (!alreadyAdded) result.push(arr[i]);\n}\nreturn result;\n}"}, {"id": 17, "title": "Reverse an Array (in place, two-pointer swap)", "hint": "Use two pointers. Swap the first and last values, then move both pointers toward the center.", "solution": "function reverseArray(arr: number[]): number[] {\nlet left = 0;\nlet right = arr.length - 1;\nwhile (left < right) {\nconst temp = arr[left];\narr[left] = arr[right];\narr[right] = temp;\nleft++;\nright--;\n}\nreturn arr;\n}"}, {"id": 18, "title": "Check whether a Number is an Armstrong Number", "hint": "Count the digits, calculate each digit raised to that digit-count using a loop, then compare the sum with the original number.", "solution": "function isArmstrongNumber(num: number): boolean {\nlet numDigits = 0;\nlet temp = num;\nif (temp === 0) numDigits = 1;\nwhile (temp > 0) {\nnumDigits++;\ntemp = Math.trunc(temp / 10);\n}\nlet sum = 0;\ntemp = num;\nwhile (temp > 0) {\nconst digit = temp % 10;\nlet power = 1;\nfor (let i = 0; i < numDigits; i++) {\npower = power * digit;\n}\nsum += power;\ntemp = Math.trunc(temp / 10);\n}\nreturn sum === num;\n}"}, {"id": 19, "title": "Check whether a Number is a Magic Number", "hint": "Repeatedly calculate the sum of digits until one digit remains. A magic number ends with 1.", "solution": "function digitSum(num: number): number {\nlet sum = 0;\nlet temp = num;\nwhile (temp > 0) {\nsum += temp % 10;\ntemp = Math.trunc(temp / 10);\n}\nreturn sum;\n}\nfunction isMagicNumber(num: number): boolean {\nlet sum = num;\nwhile (sum >= 10) {\nsum = digitSum(sum);\n}\nreturn sum === 1;\n}"}, {"id": 20, "title": "Check whether a Number is a Harshad (Niven) Number", "hint": "Find the sum of the digits and check whether the original number is divisible by that sum.", "solution": "function isHarshadNumber(num: number): boolean {\nconst sum = digitSum(num);\nreturn num % sum === 0;\n}"}, {"id": 21, "title": "Fibonacci Series up to n terms", "hint": "Keep the previous two Fibonacci values. Add the current value to the result, then calculate the next pair.", "solution": "function fibonacciSeries(n: number): number[] {\nconst series: number[] = [];\nlet a = 0;\nlet b = 1;\nfor (let i = 0; i < n; i++) {\nseries.push(a);\nconst next = a + b;\na = b;\nb = next;\n}\nreturn series;\n}"}, {"id": 22, "title": "Factorial of a Number (iterative)", "hint": "Start the result at 1 and multiply it by every integer from 2 through n.", "solution": "function factorial(n: number): number {\nlet result = 1;\nfor (let i = 2; i <= n; i++) {\nresult *= i;\n}\nreturn result;\n}"}, {"id": 23, "title": "Check whether a Number is Prime", "hint": "Numbers below 2 are not prime. Test divisibility from 2 up to the square root boundary.", "solution": "function isPrime(num: number): boolean {\nif (num < 2) return false;\nfor (let i = 2; i * i <= num; i++) {\nif (num % i === 0) return false;\n}\nreturn true;\n}"}, {"id": 24, "title": "Bubble Sort an Array", "hint": "Compare adjacent elements and swap when they are in the wrong order. Repeat passes until sorted.", "solution": "function bubbleSort(arr: number[]): number[] {\nconst n = arr.length;\nfor (let i = 0; i < n - 1; i++) {\nlet swapped = false;\nfor (let j = 0; j < n - i - 1; j++) {\nif (arr[j] > arr[j + 1]) {\nconst temp = arr[j];\narr[j] = arr[j + 1];\narr[j + 1] = temp;\nswapped = true;\n}\n}\nif (!swapped) break;\n}\nreturn arr;\n}"}, {"id": 25, "title": "Binary Search on a Sorted Array", "hint": "Use low and high boundaries. Check the middle element and discard the half that cannot contain the target.", "solution": "function binarySearch(sortedArr: number[], target: number): number {\nlet low = 0;\nlet high = sortedArr.length - 1;\nwhile (low <= high) {\nconst mid = Math.trunc((low + high) / 2);\nif (sortedArr[mid] === target) return mid;\nif (sortedArr[mid] < target) low = mid + 1;\nelse high = mid - 1;\n}\nreturn -1;\n}"}, {"id": 26, "title": "Swap Two Numbers Without Using a Third (Temp) Variable", "hint": "Use arithmetic to move the values without a temporary variable: add, subtract, subtract.", "solution": "interface NumberPair {\na: number;\nb: number;\n}\nfunction swapTwoNumbers(a: number, b: number): NumberPair {\na = a + b;\nb = a - b;\na = a - b;\nreturn { a, b };\n}"}, {"id": 27, "title": "Swap Two Strings Without Using a Third (Temp) Variable", "hint": "Concatenate the two strings, then use a manual substring function to recover the two swapped values.", "solution": "interface StringPair {\nstr1: string;\nstr2: string;\n}\nfunction manualSubstring(str: string, start: number, end: number): string {\nlet result = \"\";\nfor (let i = start; i < end; i++) {\nresult += str[i];\n}\nreturn result;\n}\nfunction swapTwoStrings(str1: string, str2: string): StringPair {\nstr1 = str1 + str2;\nstr2 = manualSubstring(str1, 0, str1.length - str2.length);\nstr1 = manualSubstring(str1, str2.length,\nstr1.length);\nreturn { str1, str2 };\n}"}, {"id": 28, "title": "Find the Missing Number in an Array of 1..n", "hint": "Calculate the expected sum from 1 to n, calculate the actual sum, and subtract actual from expected.", "solution": "function findMissingNumber(arr:\nnumber[], n: number): number {\nlet expectedSum = 0;\nfor (let i = 1; i <= n; i++) {\nexpectedSum += i;\n}\nlet actualSum = 0;\nfor (let i = 0; i < arr.length; i++) {\nactualSum += arr[i];\n}\nreturn expectedSum - actualSum;\n}"}, {"id": 29, "title": "Generate a Spiral Matrix of Order n x n (clockwise, 1..n*n)", "hint": "Maintain top, bottom, left, and right boundaries. Fill one outer edge at a time clockwise, then shrink the boundaries.", "solution": "function spiralMatrix(n: number): number[][] {\nconst matrix: number[][] = [];\nfor (let i = 0; i < n; i++) {\nmatrix.push(new Array(n).fill(0));\n}\nlet top = 0;\nlet bottom = n - 1;\nlet left = 0;\nlet right = n - 1;\nlet value = 1;\nwhile (top <= bottom && left <= right) {\nfor (let col = left; col <= right;\ncol++) {\nmatrix[top][col] = value++;\n}\ntop++;\nfor (let row = top; row <= bottom;\nrow++) {\nmatrix[row][right] = value++;\n}\nright--;\nif (top <= bottom) {\nfor (let col = right; col >= left;\ncol--) {\nmatrix[bottom][col] = value++;\n}\nbottom--;\n}\nif (left <= right) {\nfor (let row = bottom; row >= top;\nrow--) {\nmatrix[row][left] = value++;\n}\nleft++;\n}\n}\nreturn matrix;\n}"}, {"id": 30, "title": "Longest Substring Without Repeating Characters", "hint": "Try substrings starting at each position. Track whether a repeated character appears and keep the longest valid range.", "solution": "function longestSubstringWithoutRepeating(str: string): string {\nlet longestStart = 0;\nlet longestLength = 0;\nfor (let i = 0; i < str.length; i++) {\nfor (let j = i; j < str.length; j++) {\nlet hasRepeat = false;\nfor (let x = i; x <= j && !hasRepeat; x++) {\nfor (let y = x + 1; y <= j; y++) {\nif (str[x] === str[y]) {\nhasRepeat = true;\nbreak;\n}\n}\n}\nif (hasRepeat) break;\nconst currentLength = j - i + 1;\nif (currentLength > longestLength) {\nlongestLength = currentLength;\nlongestStart = i;\n}\n}\n}\nreturn manualSubstring(str, longestStart,\nlongestStart + longestLength);\n}\n/*\n\\----------------------------------------------------------------------- */"}];
const STORAGE_KEY='ts-interview-practice-v1';
let state={current:0,answers:{}};
try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(saved) state=Object.assign(state,saved);}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); $('saveState').textContent='Saved automatically';};
function render(){
 const p=problems[state.current];
 $('problemSelect').value=String(state.current);
 $('problemNo').textContent=`Problem ${p.id} of ${problems.length}`;
 $('question').textContent=p.title;
 $('answer').value=state.answers[p.id]||'';
 $('hint').textContent=p.hint;
 $('solution').textContent=p.solution;
 $('prevBtn').disabled=state.current===0;
 $('nextBtn').disabled=state.current===problems.length-1;
 $('progressFill').style.width=((state.current+1)/problems.length*100)+'%';
 updateStatus();
}
function updateStatus(){const p=problems[state.current]; const val=(state.answers[p.id]||'').trim(); $('answerState').textContent=val?'Saved':'Not started';}
$('problemSelect').addEventListener('change',e=>{state.current=Number(e.target.value);save();render();});
$('answer').addEventListener('input',e=>{state.answers[problems[state.current].id]=e.target.value;save();updateStatus();});
$('prevBtn').addEventListener('click',()=>{if(state.current>0){state.current--;save();render();window.scrollTo({top:0,behavior:'smooth'});}});
$('nextBtn').addEventListener('click',()=>{if(state.current<problems.length-1){state.current++;save();render();window.scrollTo({top:0,behavior:'smooth'});}});
async function copyText(textToCopy, successMessage) {
 try {
  await navigator.clipboard.writeText(textToCopy);
  $('saveState').textContent = successMessage;
 } catch (e) {
  const temp = document.createElement('textarea');
  temp.value = textToCopy;
  document.body.appendChild(temp);
  temp.select();
  try { document.execCommand('copy'); $('saveState').textContent = successMessage; } catch (_) {}
  temp.remove();
 }
}
$('clearBtn').addEventListener('click',()=>{const id=problems[state.current].id;if(!confirm('Reset your answer for this problem?'))return;delete state.answers[id];save();render();});
$('copyBtn').addEventListener('click',()=>{const p=problems[state.current];copyText(`Problem ${p.id}: ${p.title}`,'Question copied');});
$('copyYourAnswerBtn').addEventListener('click',()=>{copyText($('answer').value,'Your answer copied');});
$('copySolutionBtn').addEventListener('click',()=>{copyText(problems[state.current].solution,'Suggested answer copied');});
for(const p of problems){const o=document.createElement('option');o.value=String(problems.indexOf(p));o.textContent=`${p.id}. ${p.title}`;$('problemSelect').appendChild(o)}
render();
</script></body></html>
